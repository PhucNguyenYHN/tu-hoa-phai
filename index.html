<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tứ Hoá Phái</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&amp;display=swap">
<style>
:root{--bg:#1c1b19;--bar:#2a2825;--fg:#ece7dc;--mut:#a39d8f;--acc:#d9a441}
@media (prefers-color-scheme:light){:root{--bg:#efe9db;--bar:#fbf7ee;--fg:#2b2620;--mut:#7a7061;--acc:#9c2f2f}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
header{display:flex;gap:8px;align-items:center;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:var(--bar);flex-wrap:wrap}
header h1{font-size:16px;margin:0 auto 0 0;color:var(--acc)}
button,select,input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--mut);border-radius:8px;padding:6px 12px}
button{min-width:44px;min-height:40px}
input{width:72px;text-align:center}
#stage{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;justify-content:center;align-items:flex-start;touch-action:pan-x pan-y pinch-zoom}
#stage img{max-width:100%;height:auto;display:block;background:#fff}
#stage.fit img{max-height:100%;width:auto;object-fit:contain}
#stage.wide img{max-width:none;width:100%}
#ptxt{white-space:pre-wrap;font:18px/1.6 "Noto Serif","Times New Roman",Palatino,"Palatino Linotype","Segoe UI",Arial,sans-serif;font-variant-ligatures:none;max-width:720px;margin:0;padding:16px;width:100%}
#main{flex:1;display:flex;min-height:0;position:relative}
#tbox{display:none;width:320px;flex:none;padding:6px 10px;background:var(--bar);border-right:1px solid var(--mut);overflow:auto;-webkit-overflow-scrolling:touch}
#tbox.open{display:block}
@media (max-width:899px){#tbox.open{position:absolute;z-index:5;left:0;top:0;bottom:0;width:min(86vw,340px);box-shadow:4px 0 16px rgba(0,0,0,.4)}}
#tbox div{padding:8px 4px;border-bottom:1px solid var(--mut);cursor:pointer;display:flex;gap:8px;justify-content:space-between}
#tbox .l1{font-weight:700;color:var(--acc);padding-top:12px}#tbox .l3{padding-left:22px;font-size:14px;color:var(--mut)}#tbox .l2{padding-left:8px}
#tbox i{font-style:normal;color:var(--mut);white-space:nowrap}
#sbox{padding:8px 12px;background:var(--bar);border-top:1px solid var(--mut);max-height:45vh;overflow:auto}
#res div{padding:8px 4px;border-bottom:1px solid var(--mut);cursor:pointer;font-size:14px}
#res b{color:var(--acc)} #res mark{background:var(--acc);color:#000}
[hidden]{display:none!important}
footer{padding:6px 12px;padding-bottom:max(6px,env(safe-area-inset-bottom));background:var(--bar);color:var(--mut);font-size:13px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>Tứ Hoá Phái</h1>
  <select id="book" aria-label="Chọn quyển"><option value="sach1">Quyển 1</option><option value="sach2">Quyển 2</option></select>
  <button id="prev" aria-label="Trang trước">‹</button>
  <input id="pg" type="number" inputmode="numeric" min="1" aria-label="Số trang">
  <span id="tot"></span>
  <button id="next" aria-label="Trang sau">›</button>
  <button id="mode" title="Vừa khung / rộng hết cỡ">⤢</button>
  <button id="txt" title="Đối chiếu với ảnh trang gốc">Ảnh gốc</button>
  <button id="srch" title="Tìm trong sách">🔍</button>
  <button id="tocb" title="Mục lục">☰ Mục lục</button>
  <button onclick="location.href='la-so/'" title="Lập lá số Tứ Hóa">Lập lá số</button>
</header>
<div id="sbox" hidden>
  <input id="q" type="search" placeholder="Tìm (vd: hóa lộc, thể dụng)…" style="width:100%">
  <div id="res"></div>
</div>
<div id="main">
<nav id="tbox" aria-label="Mục lục"></nav>
<div id="stage"><img id="img" alt="Trang sách" hidden><pre id="ptxt"></pre></div>
</div>
<footer>Vuốt trái/phải hoặc phím ← → để lật trang · Chạm đúp để phóng to</footer>
<script>
(function(){
  var books={sach1:{n:824},sach2:{n:817}};
  var $=function(i){return document.getElementById(i)};
  var cur={b:"sach1",p:1},textMode=true;
  function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
  function pad(n){return ("000"+n).slice(-4)}
  function show(){
    var n=books[cur.b].n;
    cur.p=Math.max(1,Math.min(n,cur.p|0||1));
    if(!textMode)$("img").src=cur.b+"/"+pad(cur.p)+".jpg";
    $("pg").value=cur.p;$("pg").max=n;$("tot").textContent="/ "+n;
    $("book").value=cur.b;
    $("stage").scrollTop=0;
    ls("pos",cur.b+":"+cur.p);
    loadText();
    if($("tbox").classList.contains("open")&&tocBook!==cur.b)renderToc();
    // tải trước trang kế
    if(!textMode&&cur.p<n){var i=new Image();i.src=cur.b+"/"+pad(cur.p+1)+".jpg"}
  }
  function loadText(){
    if(!textMode)return;
    var b=cur.b,p=cur.p;
    fetch("text/"+b+"/"+pad(p)+".txt").then(function(r){return r.text()}).then(function(t){
      if(b===cur.b&&p===cur.p)$("ptxt").textContent=t.normalize("NFC").replace(/([^\n])\n(?!\n)/g,"$1 ");
    }).catch(function(){$("ptxt").textContent="(chưa có chữ cho trang này)"});
  }
  $("txt").onclick=function(){
    textMode=!textMode;$("img").hidden=textMode;$("ptxt").hidden=!textMode;
    $("txt").textContent=textMode?"Ảnh gốc":"Chữ";
    if(!textMode)$("img").src=cur.b+"/"+pad(cur.p)+".jpg";
    $("stage").classList.toggle("fit",!textMode&&!$("stage").classList.contains("wide"));
    loadText();
  };
  var idx={};
  function norm(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d")}
  function loadIdx(b){
    if(idx[b])return Promise.resolve(idx[b]);
    return fetch("index-"+b+".json").then(function(r){return r.json()}).then(function(a){
      idx[b]=a.map(function(t){return{t:t,n:norm(t)}});return idx[b]});
  }
  function esc(s){return s.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
  function search(){
    var q=$("q").value.trim(),res=$("res");
    if(q.length<2){res.innerHTML="";return}
    var nq=norm(q);res.innerHTML="Đang tìm…";
    loadIdx(cur.b).then(function(a){
      var out=[],i,m,n;
      for(i=0;i<a.length&&out.length<60;i++){
        m=a[i].n.indexOf(nq);
        if(m>=0){var s=Math.max(0,m-50);out.push('<div data-p="'+(i+1)+'"><b>Tr.'+(i+1)+'</b> … '+esc(a[i].t.slice(s,m))+'<mark>'+esc(a[i].t.slice(m,m+q.length))+'</mark>'+esc(a[i].t.slice(m+q.length,m+q.length+70))+' …</div>')}
      }
      res.innerHTML=out.length?out.join(""):"Không thấy trong "+(cur.b==="sach1"?"Quyển 1":"Quyển 2");
    });
  }
  $("srch").onclick=function(){var s=$("sbox");s.hidden=!s.hidden;if(!s.hidden){if(window.innerWidth<900)tocOpen(false);$("q").focus()}};
  var tm;$("q").oninput=function(){clearTimeout(tm);tm=setTimeout(search,250)};
  $("res").onclick=function(e){var d=e.target.closest("div[data-p]");if(d){cur.p=+d.getAttribute("data-p");show()}};
  var tocs={},tocBook=null;
  function renderToc(){
    var b=cur.b,box=$("tbox");tocBook=b;
    function draw(a){
      box.innerHTML=a.map(function(x){return '<div class="l'+x[0]+'" data-p="'+x[2]+'"><span>'+esc(x[1])+'</span><i>tr.'+x[2]+'</i></div>'}).join("");
    }
    if(tocs[b])return draw(tocs[b]);
    box.textContent="Đang tải…";
    fetch("toc-"+b+".json").then(function(r){return r.json()}).then(function(a){tocs[b]=a;if(b===cur.b)draw(a)})
      .catch(function(){box.textContent="Chưa có mục lục."});
  }
  function tocOpen(v){$("tbox").classList.toggle("open",v);if(v)renderToc()}
  $("tocb").onclick=function(){tocOpen(!$("tbox").classList.contains("open"))};
  $("tbox").onclick=function(e){var d=e.target.closest("div[data-p]");if(d){cur.p=+d.getAttribute("data-p");if(window.innerWidth<900)tocOpen(false);show()}};
  if(window.innerWidth>=900)tocOpen(true);
  function go(d){cur.p+=d;show()}
  $("prev").onclick=function(){go(-1)};
  $("next").onclick=function(){go(1)};
  $("pg").onchange=function(){cur.p=parseInt(this.value,10);show()};
  $("book").onchange=function(){cur.b=this.value;cur.p=parseInt(ls("pos_"+cur.b),10)||1;show();if($("tbox").classList.contains("open"))renderToc()};
  $("mode").onclick=function(){var s=$("stage");var w=s.classList.toggle("wide");s.classList.toggle("fit",!w)};
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT")return;
    if(e.key==="ArrowRight"||e.key==="PageDown")go(1);
    if(e.key==="ArrowLeft"||e.key==="PageUp")go(-1);
  });
  var x0=null,y0=null;
  $("stage").addEventListener("touchstart",function(e){if(e.touches.length===1){x0=e.touches[0].clientX;y0=e.touches[0].clientY}else x0=null},{passive:true});
  $("stage").addEventListener("touchend",function(e){
    if(x0===null)return;var t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5&&$("stage").classList.contains("fit"))go(dx<0?1:-1);
  },{passive:true});
  $("stage").addEventListener("dblclick",function(){$("mode").onclick()});
  window.addEventListener("beforeunload",function(){ls("pos_"+cur.b,cur.p)});
  document.addEventListener("visibilitychange",function(){ls("pos_"+cur.b,cur.p)});
  var q=(location.hash||"").match(/^#(sach[12])-(\d+)$/),saved=(ls("pos")||"").split(":");
  if(q){cur.b=q[1];cur.p=+q[2]}else if(books[saved[0]]){cur.b=saved[0];cur.p=+saved[1]}
  show();
})();
</script>
</body>
</html>
